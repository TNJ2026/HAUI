<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-surface": "#213145",
            "on-secondary-container": "#00217a",
            "error": "#ba1a1a",
            "surface-bright": "#f8f9ff",
            "primary-fixed": "#dbe1ff",
            "surface-tint": "#0053db",
            "secondary-container": "#708cfd",
            "on-primary-fixed-variant": "#003ea8",
            "on-primary-fixed": "#00174b",
            "primary-container": "#2563eb",
            "on-primary": "#ffffff",
            "on-error": "#ffffff",
            "tertiary-fixed-dim": "#c0c7d0",
            "secondary-fixed": "#dde1ff",
            "on-tertiary": "#ffffff",
            "surface-container-high": "#dce9ff",
            "on-tertiary-container": "#eaf1fa",
            "surface-variant": "#d3e4fe",
            "tertiary-container": "#676e76",
            "surface": "#f8f9ff",
            "on-secondary-fixed-variant": "#173bab",
            "on-secondary": "#ffffff",
            "primary": "#004ac6",
            "on-surface-variant": "#434655",
            "tertiary-fixed": "#dce3ec",
            "on-surface": "#0b1c30",
            "tertiary": "#4e565d",
            "on-tertiary-fixed": "#151c23",
            "background": "#f8f9ff",
            "outline": "#737686",
            "inverse-primary": "#b4c5ff",
            "on-tertiary-fixed-variant": "#40484f",
            "secondary-fixed-dim": "#b8c4ff",
            "surface-container-low": "#eff4ff",
            "surface-container-highest": "#d3e4fe",
            "on-secondary-fixed": "#001453",
            "secondary": "#3755c3",
            "primary-fixed-dim": "#b4c5ff",
            "error-container": "#ffdad6",
            "outline-variant": "#c3c6d7",
            "inverse-on-surface": "#eaf1ff",
            "surface-dim": "#cbdbf5",
            "on-primary-container": "#eeefff",
            "on-background": "#0b1c30",
            "surface-container": "#e5eeff",
            "surface-container-lowest": "#ffffff",
            "on-error-container": "#93000a"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin": "48px",
            "gutter": "24px",
            "grid_size": "32px",
            "unit": "4px"
          },
          "fontFamily": {
            "mono-code": ["Space Grotesk"],
            "headline-xl": ["Space Grotesk"],
            "body-md": ["Space Grotesk"],
            "label-sm": ["Space Grotesk"],
            "headline-lg": ["Space Grotesk"]
          },
          "fontSize": {
            "mono-code": ["14px", {"lineHeight": "1.5", "letterSpacing": "-0.01em", "fontWeight": "400"}],
            "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
            "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "500"}],
            "headline-lg": ["24px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}]
          }
        },
      },
    }
  </script>
<style>
    .technical-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(37, 99, 235, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.05) 1px, transparent 1px);
    }
    .grid-plus {
      position: absolute;
      width: 9px;
      height: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-plus::before, .grid-plus::after {
      content: '';
      position: absolute;
      background-color: rgba(37, 99, 235, 0.2);
    }
    .grid-plus::before { width: 1px; height: 9px; }
    .grid-plus::after { width: 9px; height: 1px; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-hidden h-screen flex flex-col">
<!-- TopAppBar Section -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-14 border-b border-primary/20 bg-background/80 backdrop-blur-sm">
<div class="flex items-center gap-2">
<span class="font-['Space_Grotesk'] tracking-widest uppercase text-xs text-primary font-bold">CHAT</span>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center border border-primary/30 py-1 px-2 rounded-sm bg-primary/5 text-primary hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-[18px]">history</span>
</button>
</div>
</header>
<!-- Main Canvas (Grid Background) -->
<main class="flex-1 relative technical-grid flex flex-col items-center justify-center p-gutter mt-14">
<!-- Grid Indicators (Decor) -->
<div class="grid-plus top-[-4.5px] left-[-4.5px]"></div>
<div class="grid-plus top-[-4.5px] right-[-4.5px]"></div>
<div class="grid-plus bottom-[-4.5px] left-[-4.5px]"></div>
<div class="grid-plus bottom-[-4.5px] right-[-4.5px]"></div>
<!-- Empty State Content -->
<div class="max-w-md w-full text-center space-y-6">
<div class="inline-flex flex-col items-center justify-center p-8 border border-outline-variant bg-surface-container-lowest shadow-[2px_2px_0px_rgba(37,99,235,0.1)] relative">
<div class="absolute -top-3 left-4 bg-surface-container-lowest px-2 border border-outline-variant text-[10px] font-mono-code text-primary uppercase tracking-tighter">
          System_Status
        </div>
<div class="w-16 h-16 flex items-center justify-center border border-dashed border-outline-variant rounded mb-4">
<span class="material-symbols-outlined text-outline-variant text-4xl" data-icon="chat_bubble_outline">chat_bubble_outline</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface-variant mb-2">READY_FOR_INPUT</h1>
<p class="text-label-sm font-label-sm text-outline uppercase leading-relaxed max-w-[240px]">
          Establish a new secure line or select a previous session from the history directory.
        </p>
<button class="mt-6 flex items-center gap-2 border border-primary/40 bg-primary/5 px-6 py-2 text-primary hover:bg-primary/10 transition-all group">
<span class="material-symbols-outlined text-[18px]">history</span>
<span class="font-mono-code text-[11px] font-bold tracking-widest uppercase">Resume Previous Session</span>
<span class="material-symbols-outlined text-[14px] opacity-0 group-hover:opacity-100 transition-opacity ml-1">arrow_forward</span>
</button><div class="mt-8 flex gap-4 w-full">
<div class="h-[1px] flex-1 bg-outline-variant self-center"></div>
<span class="text-[9px] font-mono-code text-outline-variant">REF_NO: 00-CHAT-INF</span>
<div class="h-[1px] flex-1 bg-outline-variant self-center"></div>
</div>
</div>
</div>
</main>
<!-- Interaction Area -->
<footer class="bg-surface-container-low border-t border-outline-variant p-4 space-y-4">
<!-- Input Box -->
<div class="max-w-4xl mx-auto w-full relative">
<div class="flex items-end gap-3 border border-outline p-3 bg-surface-container-lowest shadow-[inset_0_1px_4px_rgba(0,0,0,0.05)] focus-within:ring-1 focus-within:ring-primary focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-outline pb-1" data-icon="attachment">attachment</span>
<textarea class="w-full bg-transparent border-none focus:ring-0 font-mono-code text-on-surface placeholder:text-outline-variant resize-none py-1" placeholder="ENTER COMMAND OR MESSAGE..." rows="1"></textarea>
<button class="bg-primary text-on-primary px-4 py-2 uppercase font-bold text-[11px] tracking-widest hover:brightness-110 active:scale-95 transition-all">
          SEND
        </button>
</div>
<div class="flex justify-between mt-1 px-1">
<span class="text-[9px] font-mono-code text-outline uppercase tracking-tighter">Secure Protocol v4.2</span>
<span class="text-[9px] font-mono-code text-outline uppercase tracking-tighter">0 / 2000 CHAR</span>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-4 bg-surface-container-highest border-t border-primary/20 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 hover:text-primary transition-all w-1/3" href="#">
<span class="material-symbols-outlined mb-0.5 text-[24px]">memory</span>
<span class="font-label-sm text-[10px] tracking-widest uppercase">HERMES</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary px-2 py-1 shadow-[0_0_15px_rgba(37,99,235,0.3)] scale-100 transition-all w-1/3 rounded-sm" href="#">
<span class="material-symbols-outlined mb-0.5 text-[24px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="font-label-sm text-[10px] tracking-widest uppercase">CHAT</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 hover:text-primary transition-all w-1/3" href="#">
<span class="material-symbols-outlined mb-0.5 text-[24px]">settings_input_component</span>
<span class="font-label-sm text-[10px] tracking-widest uppercase">SETTINGS</span>
</a>
</nav>
</footer>
<!-- Padding for fixed bottom nav -->
<div class="h-16 shrink-0"></div>
</body></html>
